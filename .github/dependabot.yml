version: 2
updates:
  - package-ecosystem: 'npm'
    directory: '/'
    # A schedule is required for this ecosystem entry, but routine version
    # update PRs are intentionally disabled below.
    schedule:
      interval: 'weekly'
    groups:
      security-updates:
        applies-to: 'security-updates'
        patterns:
          - '*'
    open-pull-requests-limit: 0
